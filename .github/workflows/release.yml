name: Release & Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Evaluate PRs & Tags)
    runs-on: ubuntu-latest
    if: github.repository == 'tarunprakash2468/private-index'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-macos:
    name: Build & Publish macOS Release (.dmg & CLI)
    runs-on: macos-14
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ needs.release-please.outputs.version }}" ]; then
            VER="${{ needs.release-please.outputs.version }}"
            TAG="${{ needs.release-please.outputs.tag_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            TAG="v${VER}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version: ${VER} (tag: ${TAG})"

      - name: Select Xcode
        run: |
          echo "Active Xcode: $(xcode-select -p)"
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Cache Core ML Embedding Model
        id: cache-model
        uses: actions/cache@v6
        with:
          path: Packages/PrivateIndexEngine/Sources/PrivateIndexEngine/Resources/all-MiniLM-L6-v2.mlmodelc
          key: coreml-model-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt', 'scripts/convert_model.py') }}

      - name: Compile & Verify Core ML Embedding Model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/convert_model.py --compile --verify

      - name: Package macOS Assets (.dmg and CLI tarball)
        run: |
          ./scripts/package_macos.sh "${{ steps.version_step.outputs.version }}"

      - name: Compute Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          VER="v${{ steps.version_step.outputs.version }}"
          for t in "${TAG}" "${VER}"; do
            gh release upload "${t}" dist/*.dmg dist/*.tar.gz dist/SHA256SUMS.txt dist/*.rb --clobber || \
            gh release create "${t}" dist/*.dmg dist/*.tar.gz dist/SHA256SUMS.txt dist/*.rb \
              --title "Private Index ${{ steps.version_step.outputs.version }}" \
              --generate-notes || true
          done

      - name: Sync Formula to Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/private-index.rb
          if ! git diff --staged --quiet; then
            VER="${{ steps.version_step.outputs.version }}"
            git commit -m "chore(formula): bump Homebrew formula to ${VER}"
            if git push origin main; then
              echo "Successfully pushed formula update directly to main"
            else
              echo "Direct push to main rejected by branch protection; syncing via pull request..."
              BRANCH="chore/bump-formula-${VER}-${GITHUB_RUN_ID}"
              git checkout -b "${BRANCH}"
              git push -u origin "${BRANCH}"
              PR_URL=$(gh pr create --title "chore(formula): bump Homebrew formula to ${VER}" \
                --body "Automated Homebrew formula checksum bump for release ${VER}." \
                --head "${BRANCH}" --base main)
              gh pr merge "${PR_URL}" --merge --delete-branch --admin || gh pr merge "${PR_URL}" --merge --delete-branch
              echo "Successfully merged formula update PR: ${PR_URL}"
            fi
          fi

  deploy-ios:
    name: Deploy iOS to Apple TestFlight
    runs-on: macos-14
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ needs.release-please.outputs.version }}" ]; then
            VER="${{ needs.release-please.outputs.version }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VER}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Cache Core ML Embedding Model
        id: cache-ios-model
        uses: actions/cache@v6
        with:
          path: Packages/PrivateIndexEngine/Sources/PrivateIndexEngine/Resources/all-MiniLM-L6-v2.mlmodelc
          key: coreml-model-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt', 'scripts/convert_model.py') }}

      - name: Compile & Verify Core ML Embedding Model
        if: steps.cache-ios-model.outputs.cache-hit != 'true'
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/convert_model.py --compile --verify

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ./scripts/deploy_ios_testflight.sh "${{ steps.version_step.outputs.version }}"
